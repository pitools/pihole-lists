name: Deploy
enable-email-notifications: true

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy
    runs-on: podman
    container: docker.io/library/node:26

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compile
        run: ./cmd/compile

      - name: Validate source list
        run: ./cmd/validate

      - name: Configure Git User
        run: |
          git config --global user.name "forgejo-actions[bot]"
          git config --global user.email "forgejo-actions[bot]@local"
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true

      - name: Push to lists branch
        run: |
          set -eu
          git fetch origin lists || true

          if git show-ref --verify --quiet refs/remotes/origin/lists; then
            git worktree add /tmp/lists-deploy origin/lists
          else
            mkdir -p /tmp/lists-deploy
            git worktree add --orphan lists /tmp/lists-deploy
          fi

          find /tmp/lists-deploy -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -a ./lists/. /tmp/lists-deploy/
          cd /tmp/lists-deploy

          git add -A
          git diff --cached --quiet || git commit -m "Update lists from $GITHUB_SHA"
          git push origin HEAD:lists
